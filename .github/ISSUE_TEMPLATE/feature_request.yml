name: Feature request
description: Propose a new capability (GDS format, output format, API feature).
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: input
    id: roadmap
    attributes:
      label: Related roadmap phase
      placeholder: e.g. Phase 3 — Sabre

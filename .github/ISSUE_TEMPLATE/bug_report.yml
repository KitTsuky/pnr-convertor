name: Bug report
description: A PNR is parsed incorrectly, or the API misbehaves.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real PNRs.** Replace names, contacts, document numbers and record locators
        with fictional values (e.g. `DOE/JANE`, `ABC123`) before submitting.
  - type: dropdown
    id: gds
    attributes:
      label: GDS format
      options: [Amadeus, Sabre, Travelport, Other / unknown]
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Anonymized PNR input
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Response body or error.
      render: json
    validations:
      required: true

[project]
name = "pnr-convertor"
version = "0.1.0"
description = "API that converts raw GDS PNR text into structured, readable itineraries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "airportsdata>=20260905",
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "tzdata>=2026.5",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pnr_convertor"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # bugbear
  "A",   # builtins shadowing
  "C4",  # comprehensions
  "SIM", # simplify
  "RET", # return
  "PT",  # pytest style
  "PTH", # pathlib
  "ARG", # unused arguments
  "S",   # bandit (security)
  "T20", # no print
  "ERA", # no commented-out code
  "PL",  # pylint
  "RUF", # ruff-specific
]
ignore = [
  "PLR2004", # magic values: parsing code compares against domain constants inline
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = [
  "error",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["pnr_convertor"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
